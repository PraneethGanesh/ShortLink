spring:
  application:
    name: identityservice
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/identity_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8190
application:
  frontend:
    registration-url: ${FRONTEND_REGISTRATION_URL:http://localhost:5173/register/complete}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 86400000