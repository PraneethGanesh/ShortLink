spring:
  cloud:
    zookeeper:
      enabled: false
  datasource:
    url: jdbc:h2:mem:urlservice_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
application:
  short-url:
    base-url: http://localhost:8191
    code-length: 7
    redirect-cache-ttl-seconds: 300